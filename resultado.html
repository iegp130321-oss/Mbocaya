<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tapadita - Verificación Oficial</title>
  <style>
    :root {
      --bg1: #0b1023;
      --bg2: #17233d;
      --gold-1: #f7d774;
      --gold-2: #f3b43b;
      --gold-3: #fff3bf;
      --card: rgba(255, 255, 255, 0.96);
      --text: #111827;
      --muted: #4b5563;
      --line: rgba(17, 24, 39, 0.08);
      --button: #1d4ed8;
      --button-hover: #173bb6;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(247, 215, 116, 0.22), transparent 30%),
        linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: min(92vw, 720px);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 22px 50px rgba(0, 0, 0, 0.22);
      overflow: hidden;
      position: relative;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(247, 215, 116, 0.12), rgba(255,255,255,0));
      pointer-events: none;
    }

    .header {
      background: linear-gradient(135deg, var(--gold-1), var(--gold-2));
      padding: 22px 28px 18px;
      border-bottom: 1px solid rgba(17, 24, 39, 0.08);
      position: relative;
      z-index: 1;
    }

    .badge {
      display: inline-block;
      background: rgba(17, 24, 39, 0.88);
      color: #fff7d6;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      padding: 8px 12px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .content {
      padding: 32px 28px 26px;
      position: relative;
      z-index: 1;
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
      color: #111827;
      text-align: center;
    }

    .prize-box {
      background: linear-gradient(180deg, #fffdf8, #fffaf0);
      border: 1px solid rgba(243, 180, 59, 0.4);
      border-radius: 18px;
      padding: 20px 18px;
      text-align: center;
      margin-bottom: 26px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .prize-label {
      display: block;
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .prize-value {
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 900;
      color: #111827;
      letter-spacing: -0.04em;
    }

    .meta {
      display: grid;
      gap: 10px;
      margin: 0 0 28px;
      text-align: center;
      font-size: 1rem;
      color: var(--muted);
    }

    .meta strong {
      color: var(--text);
    }

    .buttons {
      display: flex;
      justify-content: center;
      margin-top: 10px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--button), var(--button-hover));
      color: #fff;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 20px rgba(29, 78, 216, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 24px rgba(29, 78, 216, 0.35);
    }

    @media (max-width: 520px) {
      .header, .content {
        padding-left: 18px;
        padding-right: 18px;
      }

      .badge {
        letter-spacing: 0.08em;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const qs = new URLSearchParams(location.search);
    const premio = qs.get('premio') || '125.000';
    const fecha = qs.get('fecha') || '';
    const id = qs.get('id') || '';
    const ganador = qs.get('ganador') || '';
    const nombre = qs.get('nombre') || '';

    document.body.innerHTML = `
      <div class="card">
        <div class="header">
          <span class="badge">Verificación oficial</span>
        </div>
        <div class="content">
          <h1>${ganador ? 'GANADOR ' + ganador : 'VERIFICADO'} ${nombre}</h1>

          <div class="prize-box">
            <span class="prize-label">Premio</span>
            <div class="prize-value">Gs ${premio}</div>
          </div>

          <div class="meta">
            <div><strong>Fecha:</strong> ${fecha || 'Sin fecha registrada'}</div>
            <div><strong>ID:</strong> ${id || 'Sin identificación'}</div>
          </div>

          <div class="buttons">
            <a class="back-btn" href="/Mbocaya/">Volver</a>
          </div>
        </div>
      </div>
    `;
  </script>
</body>
</html>
