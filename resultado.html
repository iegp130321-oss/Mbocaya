<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tapadita - Verificación Oficial</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    color: #111;
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  #root {
    max-width: 600px;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  }
  h1 {
    font-size: 2rem;
    margin-bottom: 12px;
  }
  p {
    font-size: 1.1rem;
    margin-bottom: 18px;
  }
  a {
    display: inline-block;
    text-decoration: none;
    color: white;
    background: #1d4ed8;
    padding: 10px 18px;
    border-radius: 8px;
    font-weight: bold;
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const qs = new URLSearchParams(location.search);
const premio = qs.get('premio') || '125.000';
const fecha = qs.get('fecha') || '';
const id = qs.get('id') || '';
const ganador = qs.get('ganador') || '';
const nombre = qs.get('nombre') || '';

document.body.innerHTML = `
  <div id="root">
    <h1>${ganador ? 'GANADOR ' + ganador : 'VERIFICADO'} ${nombre}</h1>
    <p>Premio Gs ${premio} - ${fecha} - ID ${id}</p>
    <a href="/Mbocaya/">Volver</a>
  </div>
`;
</script>
</body>
</html>
